name: Update Live Status

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 08:30 IST
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update status block
        env:
          GH_USERNAME: shaikasadahmed2k23
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_status.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update live status [skip ci]"
          git push
